<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Next Gen Rendering - PBR Light Studio</title>

    <!-- =========================================================
         THREE.JS
    ========================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- GUI -->
    <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>


    <!-- =========================================================
         CSS
    ========================================================== -->

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;

            overflow: hidden;

            font-family:
                Arial,
                "Noto Sans Thai",
                sans-serif;

            background: #111;

        }


        /* =====================================================
           TITLE
        ====================================================== */

        #info {

            position: fixed;

            left: 18px;
            top: 16px;

            z-index: 5;

            color: white;

            pointer-events: none;

            text-shadow:
                0 2px 6px rgba(0, 0, 0, 0.8);

        }


        #info h1 {

            margin: 0 0 5px 0;

            font-size: 20px;

            font-weight: bold;

        }


        #info p {

            margin: 0;

            font-size: 12px;

            opacity: 0.9;

        }


        /* =====================================================
           HELP TEXT
        ====================================================== */

        #hint {

            position: fixed;

            left: 18px;
            bottom: 18px;

            z-index: 5;

            color: white;

            background:
                rgba(0, 0, 0, 0.40);

            padding: 8px 12px;

            border-radius: 8px;

            font-size: 12px;

            pointer-events: none;

        }


        /* =====================================================
           LOADING
        ====================================================== */

        #loading {

            position: fixed;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            display: flex;

            justify-content: center;
            align-items: center;

            z-index: 10;

            color: white;

            background: #111;

            font-size: 18px;

        }


        /* =====================================================
           DAT.GUI
        ====================================================== */

        .dg.ac {

            z-index: 20 !important;

        }


        .dg.main {

            margin-right: 14px;

            margin-top: 60px;

        }

    </style>

</head>


<body>


    <!-- =========================================================
         LOADING
    ========================================================== -->

    <div id="loading">

        กำลังโหลดฉากและโมเดล...

    </div>


    <!-- =========================================================
         TITLE
    ========================================================== -->

    <div id="info">

        <h1>
            Next Gen Rendering — PBR Light Studio
        </h1>

        <p>
            Three.js • PBR Material • HDR Environment • Dynamic Shadows
        </p>

    </div>


    <!-- =========================================================
         HELP
    ========================================================== -->

    <div id="hint">

        🖱 ลากเมาส์ = หมุนกล้อง
        &nbsp;&nbsp;|&nbsp;&nbsp;
        Shift + ลาก = หมุนตำแหน่งแสง

    </div>



<script>


/* =============================================================
   MAIN
============================================================= */

(() => {


    /* =========================================================
       RENDERER
    ========================================================== */

    const renderer =
        new THREE.WebGLRenderer({

            antialias: true,

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio,
            2
        )

    );


    renderer.setSize(

        window.innerWidth,
        window.innerHeight

    );


    /* =========================================================
       SHADOW
    ========================================================== */

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;


    /* =========================================================
       PBR / COLOR
    ========================================================== */

    renderer.outputEncoding =
        THREE.sRGBEncoding;


    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
        1.0;


    document.body.appendChild(
        renderer.domElement
    );



    /* =========================================================
       SCENE
    ========================================================== */

    const scene =
        new THREE.Scene();



    /* =========================================================
       CAMERA
    ========================================================== */

    const camera =
        new THREE.PerspectiveCamera(

            45,

            window.innerWidth /
            window.innerHeight,

            0.1,

            1000

        );


    /*
       ตำแหน่งกล้องเริ่มต้น

       x = ซ้าย/ขวา
       y = สูง
       z = หน้า/หลัง
    */

    camera.position.set(

        4.5,
        3.0,
        7.5

    );



    /* =========================================================
       ORBIT CONTROLS
    ========================================================== */

    const controls =
        new THREE.OrbitControls(

            camera,
            renderer.domElement

        );


    controls.target.set(

        0,
        1.0,
        0

    );


    controls.enableDamping = true;


    controls.dampingFactor = 0.06;


    controls.minDistance = 2;


    controls.maxDistance = 20;


    /*
       ไม่ให้กล้องลงไปอยู่ใต้พื้น
    */

    controls.maxPolarAngle =
        Math.PI / 2.02;



    /* =========================================================
       ENVIRONMENT 360°
    ========================================================== */

    const exrSkyboxUrl =

        "https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/relax_inn_seaview_suite_1k.exr";


    const pmremGenerator =

        new THREE.PMREMGenerator(
            renderer
        );


    pmremGenerator
        .compileEquirectangularShader();



    const exrLoader =
        new THREE.EXRLoader();



    exrLoader

        .setDataType(
            THREE.UnsignedByteType
        )

        .load(

            exrSkyboxUrl,

            (texture) => {


                /*
                   Environment สำหรับ PBR
                */

                const envRT =
                    pmremGenerator
                        .fromEquirectangular(
                            texture
                        );


                scene.environment =
                    envRT.texture;



                /*
                   HDRI เป็นฉากหลัง 360°
                */

                texture.mapping =
                    THREE.EquirectangularReflectionMapping;


                texture.encoding =
                    THREE.RGBEEncoding;


                scene.background =
                    texture;



                pmremGenerator.dispose();

            },


            undefined,


            (error) => {

                console.error(
                    "HDRI loading error:",
                    error
                );


                /*
                   ถ้า HDRI โหลดไม่ได้
                   ใช้สีฟ้าแทน
                */

                scene.background =
                    new THREE.Color(
                        0x9fb7c5
                    );


                pmremGenerator.dispose();

            }

        );



    /* =========================================================
       AMBIENT LIGHT
    ========================================================== */

    const ambientLight =

        new THREE.AmbientLight(

            0xffffff,

            0.55

        );


    scene.add(
        ambientLight
    );



    /* =========================================================
       DIRECTIONAL LIGHT
    ========================================================== */

    const directionalLight =

        new THREE.DirectionalLight(

            0xfff2d8,

            3.0

        );


    /*
       เปิด Shadow
    */

    directionalLight.castShadow =
        true;



    /* =========================================================
       SHADOW QUALITY
    ========================================================== */

    directionalLight.shadow.mapSize.width =
        2048;


    directionalLight.shadow.mapSize.height =
        2048;


    directionalLight.shadow.camera.near =
        0.1;


    directionalLight.shadow.camera.far =
        30;


    directionalLight.shadow.camera.left =
        -8;


    directionalLight.shadow.camera.right =
        8;


    directionalLight.shadow.camera.top =
        8;


    directionalLight.shadow.camera.bottom =
        -8;


    /*
       ลดปัญหา Shadow Acne
    */

    directionalLight.shadow.bias =
        -0.0005;


    directionalLight.shadow.normalBias =
        0.02;



    scene.add(
        directionalLight
    );



    /* =========================================================
       LIGHT TARGET
    ========================================================== */

    directionalLight.target.position.set(

        0,
        1,
        0

    );


    scene.add(
        directionalLight.target
    );



    /* =========================================================
       LIGHT MARKER
    ========================================================== */

    const lightMarker =

        new THREE.Mesh(

            new THREE.SphereGeometry(

                0.10,
                16,
                16

            ),

            new THREE.MeshBasicMaterial({

                color: 0xffaa33

            })

        );


    scene.add(
        lightMarker
    );



    /* =========================================================
       FLOOR TEXTURE
    ========================================================== */

    const floorTexture =

        new THREE.TextureLoader().load(

            "https://apygmodeler.github.io/my-cv/images/granite_tile_diff_1k.jpg"

        );


    floorTexture.wrapS =
        THREE.RepeatWrapping;


    floorTexture.wrapT =
        THREE.RepeatWrapping;


    /*
       ทำให้ Texture พื้นไม่ยืด
    */

    floorTexture.repeat.set(

        8,
        8

    );


    floorTexture.encoding =
        THREE.sRGBEncoding;



    /* =========================================================
       FLOOR MATERIAL
    ========================================================== */

    const floorMaterial =

        new THREE.MeshStandardMaterial({

            map: floorTexture,

            color: 0xffffff,

            roughness: 0.72,

            metalness: 0.05

        });



    /* =========================================================
       FLOOR
    ========================================================== */

    const floor =

        new THREE.Mesh(

            new THREE.PlaneGeometry(

                40,
                40

            ),

            floorMaterial

        );


    /*
       หมุนพื้นให้เป็นแนวนอน
    */

    floor.rotation.x =
        -Math.PI / 2;


    floor.position.y = 0;


    /*
       พื้นรับเงา
    */

    floor.receiveShadow =
        true;


    scene.add(
        floor
    );



    /* =========================================================
       MODEL
    ========================================================== */

    let model = null;


    /*
       URL โมเดลของคุณ
    */

    const modelUrl =

        "https://warada-800.github.io/Warada-800.github.io_wed-Page/robot_B.glb";



    const gltfLoader =
        new THREE.GLTFLoader();



    gltfLoader.load(

        modelUrl,


        /* =====================================================
           MODEL LOADED
        ====================================================== */

        (gltf) => {


            model =
                gltf.scene;



            /* =================================================
               1. คำนวณ Bounding Box
            ================================================== */

            const originalBox =

                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const originalSize =

                originalBox.getSize(
                    new THREE.Vector3()
                );


            const originalCenter =

                originalBox.getCenter(
                    new THREE.Vector3()
                );



            /* =================================================
               2. ย้ายโมเดลมาอยู่ CENTER
            ================================================== */

            model.position.x -=
                originalCenter.x;


            model.position.z -=
                originalCenter.z;


            model.position.y -=
                originalBox.min.y;



            /* =================================================
               3. ตรวจสอบขนาดโมเดล
            ================================================== */

            const maxDimension =

                Math.max(

                    originalSize.x,

                    originalSize.y,

                    originalSize.z

                );



            /*
               ถ้าโมเดลใหญ่เกิน 3 หน่วย
               ให้ย่ออัตโนมัติ
            */

            if (
                maxDimension > 3
            ) {

                const scale =

                    3 /
                    maxDimension;


                model.scale.setScalar(
                    scale
                );

            }



            /* =================================================
               4. จัดโมเดลใหม่หลัง Scale
            ================================================== */

            const finalBox =

                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const finalCenter =

                finalBox.getCenter(
                    new THREE.Vector3()
                );



            /*
               Center X/Z = 0
            */

            model.position.x -=
                finalCenter.x;


            model.position.z -=
                finalCenter.z;



            /*
               ให้เท้าของโมเดลแตะพื้น
            */

            model.position.y -=
                finalBox.min.y;



            /* =================================================
               5. MODEL MATERIAL + SHADOW
            ================================================== */

            model.traverse(

                (child) => {


                    if (
                        !child.isMesh
                    ) {

                        return;

                    }



                    /*
                       โมเดลสร้างเงา
                    */

                    child.castShadow =
                        true;


                    /*
                       โมเดลรับเงา
                    */

                    child.receiveShadow =
                        true;



                    /* =========================================
                       PBR MATERIAL
                    ========================================== */

                    if (
                        child.material
                    ) {


                        /*
                           รองรับหลาย Material
                        */

                        const materials =

                            Array.isArray(
                                child.material
                            )

                            ?

                            child.material

                            :

                            [
                                child.material
                            ];



                        materials.forEach(

                            (mat) => {


                                /*
                                   ถ้าเป็น
                                   MeshStandardMaterial
                                   อยู่แล้ว
                                   ให้ใช้ต่อ
                                */

                                if (
                                    mat.isMeshStandardMaterial
                                ) {

                                    mat.metalness =
                                        settings.metalness;


                                    mat.roughness =
                                        settings.roughness;


                                    mat.envMapIntensity =
                                        settings.iblIntensity;


                                    mat.needsUpdate =
                                        true;


                                    return;

                                }



                                /*
                                   แปลง Material
                                   เป็น PBR
                                */

                                const pbrMaterial =

                                    new THREE.MeshStandardMaterial({

                                        map:
                                            mat.map ||
                                            null,

                                        color:
                                            mat.color
                                            ?

                                            mat.color.clone()

                                            :

                                            new THREE.Color(
                                                0xffffff
                                            ),

                                        normalMap:
                                            mat.normalMap ||
                                            null,

                                        roughness:
                                            settings.roughness,

                                        metalness:
                                            settings.metalness

                                    });



                                /*
                                   กรณีมีหลาย Material
                                */

                                if (
                                    Array.isArray(
                                        child.material
                                    )
                                ) {

                                    child.material =

                                        child.material.map(

                                            (oldMat) =>

                                                oldMat === mat

                                                ?

                                                pbrMaterial

                                                :

                                                oldMat

                                        );

                                }

                                else {

                                    child.material =
                                        pbrMaterial;

                                }

                            }

                        );

                    }

                }

            );



            /* =================================================
               6. ADD MODEL
            ================================================== */

            scene.add(
                model
            );



            /* =================================================
               7. CAMERA TARGET
            ================================================== */

            const modelBox =

                new THREE.Box3()
                    .setFromObject(
                        model
                    );


            const modelCenter =

                modelBox.getCenter(
                    new THREE.Vector3()
                );


            /*
               ให้กล้องมองตรงกลางโมเดล
            */

            controls.target.copy(
                modelCenter
            );


            /*
               แต่ให้สูงขึ้นนิดหนึ่ง
               เพื่อให้เห็นตัวหุ่นสวยขึ้น
            */

            controls.target.y +=
                0.15;



            /* =================================================
               8. CAMERA POSITION
            ================================================== */

            camera.position.set(

                4.5,
                2.8,
                7.0

            );



            camera.lookAt(
                controls.target
            );



            /* =================================================
               UPDATE PBR
            ================================================== */

            updatePBR();



            /* =================================================
               HIDE LOADING
            ================================================= */

            document.getElementById(
                "loading"
            ).style.display =
                "none";


        },


        /* =====================================================
           LOADING PROGRESS
        ====================================================== */

        (xhr) => {


            if (
                xhr.total
            ) {

                const percent =

                    Math.round(

                        (
                            xhr.loaded /
                            xhr.total
                        ) * 100

                    );


                document.getElementById(
                    "loading"
                ).textContent =

                    "กำลังโหลดโมเดล... " +
                    percent +
                    "%";

            }

        },


        /* =====================================================
           ERROR
        ====================================================== */

        (error) => {

            console.error(
                "GLB loading error:",
                error
            );


            document.getElementById(
                "loading"
            ).textContent =

                "โหลดโมเดลไม่สำเร็จ";

        }

    );



    /* =========================================================
       GUI SETTINGS
    ========================================================== */

    const settings = {


        /* =====================================================
           DIRECTIONAL LIGHT
        ====================================================== */

        elevation:
            35,


        azimuth:
            135,


        lightIntensity:
            3.0,


        lightColor:
            "#fff2d8",



        /* =====================================================
           AMBIENT
        ====================================================== */

        ambientIntensity:
            0.55,


        exposure:
            1.0,



        /* =====================================================
           PBR
        ====================================================== */

        baseColor:
            "#ffffff",


        metalness:
            0.50,


        roughness:
            0.50,


        iblIntensity:
            1.20,



        /* =====================================================
           SHADOW
        ====================================================== */

        shadowEnabled:
            true



    };



    /* =========================================================
       UPDATE LIGHT
    ========================================================== */

    function updateLight() {


        /*
           แปลงองศาเป็น Radian
        */

        const elevation =

            THREE.MathUtils.degToRad(
                settings.elevation
            );


        const azimuth =

            THREE.MathUtils.degToRad(
                settings.azimuth
            );



        /*
           ระยะจากโมเดล
        */

        const radius = 8;



        /*
           คำนวณตำแหน่งแสง
        */

        directionalLight.position.set(

            radius *
            Math.cos(elevation) *
            Math.cos(azimuth),

            radius *
            Math.sin(elevation),

            radius *
            Math.cos(elevation) *
            Math.sin(azimuth)

        );



        /*
           ความเข้ม
        */

        directionalLight.intensity =

            settings.lightIntensity;



        /*
           Light target
        */

        directionalLight.target.position.set(

            0,
            1,
            0

        );



        /*
           จุดสีส้มแสดงตำแหน่งแสง
        */

        lightMarker.position.copy(

            directionalLight.position

        );

    }



    /* =========================================================
       UPDATE LIGHT COLOR
    ========================================================== */

    function updateLightColor() {


        directionalLight.color.set(

            settings.lightColor

        );

    }



    /* =========================================================
       UPDATE PBR
    ========================================================== */

    function updatePBR() {


        /*
           ถ้าโมเดลยังโหลดไม่เสร็จ
           ให้หยุดก่อน
        */

        if (
            !model
        ) {

            return;

        }



        const color =

            new THREE.Color(

                settings.baseColor

            );



        model.traverse(

            (child) => {


                if (
                    !child.isMesh
                ) {

                    return;

                }


                if (
                    !child.material
                ) {

                    return;

                }



                const materials =

                    Array.isArray(
                        child.material
                    )

                    ?

                    child.material

                    :

                    [
                        child.material
                    ];



                materials.forEach(

                    (mat) => {


                        if (
                            mat.isMeshStandardMaterial
                        ) {


                            /*
                               Base Color
                            */

                            mat.color.copy(
                                color
                            );



                            /*
                               Metalness
                            */

                            mat.metalness =

                                settings.metalness;



                            /*
                               Roughness
                            */

                            mat.roughness =

                                settings.roughness;



                            /*
                               IBL
                            */

                            mat.envMapIntensity =

                                settings.iblIntensity;



                            mat.needsUpdate =
                                true;

                        }

                    }

                );

            }

        );

    }



    /* =========================================================
       CREATE GUI
    ========================================================== */

    const gui =

        new dat.GUI({

            width: 300

        });



    /* =========================================================
       LIGHT FOLDER
    ========================================================== */

    const lightFolder =

        gui.addFolder(

            "☀️ แสงอาทิตย์ (DIRECTIONAL LIGHT)"

        );



    lightFolder

        .add(

            settings,

            "elevation",

            5,
            85,
            1

        )

        .name(
            "มุมแนวตั้ง (Elevation)"
        )

        .onChange(

            updateLight

        );



    lightFolder

        .add(

            settings,

            "azimuth",

            0,
            360,
            1

        )

        .name(
            "ทิศทาง (Azimuth)"
        )

        .onChange(

            updateLight

        );



    lightFolder

        .add(

            settings,

            "lightIntensity",

            0,
            6,
            0.05

        )

        .name(
            "ความเข้มแสง"
        )

        .onChange(

            updateLight

        );



    lightFolder

        .addColor(

            settings,

            "lightColor"

        )

        .name(
            "สีแสง (Color)"
        )

        .onChange(

            updateLightColor

        );



    lightFolder.open();



    /* =========================================================
       AMBIENT FOLDER
    ========================================================== */

    const ambientFolder =

        gui.addFolder(

            "🌤 แสงแวดล้อม (AMBIENT)"

        );



    ambientFolder

        .add(

            settings,

            "ambientIntensity",

            0,
            2,
            0.01

        )

        .name(
            "ความเข้มแสงพื้น"
        )

        .onChange(

            () => {

                ambientLight.intensity =

                    settings.ambientIntensity;

            }

        );



    ambientFolder

        .add(

            settings,

            "exposure",

            0.3,
            2.5,
            0.01

        )

        .name(
            "ค่าแสงรวม (Exposure)"
        )

        .onChange(

            () => {

                renderer.toneMappingExposure =

                    settings.exposure;

            }

        );



    ambientFolder.open();



    /* =========================================================
       PBR FOLDER
    ========================================================== */

    const pbrFolder =

        gui.addFolder(

            "🎨 PBR MATERIAL"

        );



    pbrFolder

        .addColor(

            settings,

            "baseColor"

        )

        .name(
            "Base Color"
        )

        .onChange(

            updatePBR

        );



    pbrFolder

        .add(

            settings,

            "metalness",

            0,
            1,
            0.01

        )

        .name(
            "Metalness"
        )

        .onChange(

            updatePBR

        );



    pbrFolder

        .add(

            settings,

            "roughness",

            0,
            1,
            0.01

        )

        .name(
            "Roughness"
        )

        .onChange(

            updatePBR

        );



    pbrFolder

        .add(

            settings,

            "iblIntensity",

            0,
            3,
            0.01

        )

        .name(
            "IBL Intensity"
        )

        .onChange(

            updatePBR

        );



    pbrFolder.open();



    /* =========================================================
       SHADOW CONTROL
    ========================================================== */

    gui

        .add(

            settings,

            "shadowEnabled"

        )

        .name(
            "เปิด / ปิด Shadow"
        )

        .onChange(

            (value) => {

                renderer.shadowMap.enabled =
                    value;

            }

        );



    /* =========================================================
       DEFAULT VALUES
    ========================================================== */

    updateLight();


    updateLightColor();



    /* =========================================================
       MOUSE CONTROL
       SHIFT + DRAG = MOVE LIGHT
    ========================================================== */

    let draggingLight =
        false;


    let startX =
        0;


    let startY =
        0;


    let startAzimuth =
        0;


    let startElevation =
        0;



    renderer.domElement.addEventListener(

        "pointerdown",

        (event) => {


            /*
               ถ้ากด Shift
               ให้ควบคุมแสงแทนกล้อง
            */

            if (
                event.shiftKey
            ) {


                draggingLight =
                    true;


                controls.enabled =
                    false;


                startX =
                    event.clientX;


                startY =
                    event.clientY;


                startAzimuth =
                    settings.azimuth;


                startElevation =
                    settings.elevation;


                renderer.domElement.style.cursor =
                    "grabbing";

            }

        }

    );



    window.addEventListener(

        "pointermove",

        (event) => {


            if (
                !draggingLight
            ) {

                return;

            }



            const dx =

                event.clientX -
                startX;


            const dy =

                event.clientY -
                startY;



            /*
               Mouse ซ้าย/ขวา
               = Azimuth
            */

            settings.azimuth =

                THREE.MathUtils.euclideanModulo(

                    startAzimuth +
                    dx * 0.5,

                    360

                );



            /*
               Mouse ขึ้น/ลง
               = Elevation
            */

            settings.elevation =

                THREE.MathUtils.clamp(

                    startElevation -
                    dy * 0.25,

                    5,
                    85

                );



            updateLight();

        }

    );



    window.addEventListener(

        "pointerup",

        () => {


            draggingLight =
                false;


            controls.enabled =
                true;


            renderer.domElement.style.cursor =
                "default";

        }

    );



    /* =========================================================
       RESIZE
    ========================================================== */

    window.addEventListener(

        "resize",

        () => {


            camera.aspect =

                window.innerWidth /
                window.innerHeight;



            camera.updateProjectionMatrix();



            renderer.setSize(

                window.innerWidth,
                window.innerHeight

            );

        }

    );



    /* =========================================================
       ANIMATION LOOP
    ========================================================== */

    function animate() {


        requestAnimationFrame(
            animate
        );


        controls.update();


        renderer.render(

            scene,
            camera

        );

    }



    animate();


})();

</script>

</body>

</html>
