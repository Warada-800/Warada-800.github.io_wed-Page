<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Room Viewer - Shader Project</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #222;
      font-family: sans-serif;
    }

    #menu {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
      flex-wrap: wrap;
      justify-content: center;
      width: 90%;
      max-width: 700px;
    }

    button {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      background: white;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      transition: 0.2s;
    }

    button:hover {
      background: #ffaa00;
      color: white;
    }

    #cam-info {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.75);
      color: #00ffcc;
      padding: 10px 14px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
      pointer-events: none;
      z-index: 20;
      line-height: 1.5;
    }

    #shader-info {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 10px 14px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      z-index: 20;
      line-height: 1.5;
    }
  </style>

  <!-- Three.js + Addons + GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>

<body>

  <!-- Camera Information -->
  <div id="cam-info">
    กำลังโหลดพิกัดกล้อง...
  </div>

  <!-- Shader Information -->
  <div id="shader-info">
    Vertex Shader: ผ้า<br>
    Fragment Shader: ลูกบอล
  </div>

  <!-- Menu -->
  <div id="menu">

    <button onclick="setView('overview')">
      ทั้งห้อง
    </button>

    <button onclick="setView('COM')">
      หน้าจอคอม
    </button>

    <button onclick="setView('TV')">
      หน้าจอ TV
    </button>

    <button onclick="setView('BED')">
      เตียงนอน
    </button>

    <button onclick="setView('WINDOW')">
      หน้าต่าง
    </button>

    <button onclick="setView('CLOTH')">
      ดูผ้า
    </button>

    <button onclick="setView('BALL')">
      ดูลูกบอล
    </button>

    <button onclick="window.location.href='https://warada-800.github.io/Warada-800.github.io_wed-Page/'">
      Portfolio
    </button>

  </div>


  <script>

    // =========================================================
    // ส่วนที่ 1 : ตั้งค่าพิกัดเดิม
    // =========================================================

    // Sun Light
    const SUN_CONFIG = {

      x: -0.71,
      y: 5.08,
      z: -0.29,

      color: 0xffffff,

      intensity: 1.5

    };


    // Microwave / Point Light
    const MICROWAVE_LIGHT_CONFIG = {

      x: -0.71,
      y: 5.08,
      z: -0.29,

      color: 0xffffff,

      intensity: 3.0,

      distance: 8.0

    };


    // =========================================================
    // Camera Views
    // =========================================================

    const CAMERA_VIEWS = {

      overview: {

        camera: {
          x: 0.0,
          y: 6.0,
          z: 8.0
        },

        target: {
          x: 0.0,
          y: 1.0,
          z: 0.0
        }

      },


      COM: {

        camera: {
          x: 1.53,
          y: 2.53,
          z: -1.35
        },

        target: {
          x: 1.52,
          y: 2.51,
          z: -1.51
        }

      },


      TV: {

        camera: {
          x: 1.65,
          y: 2.02,
          z: -1.05
        },

        target: {
          x: 1.99,
          y: 2.1,
          z: -1.06
        }

      },


      BED: {

        camera: {
          x: 0.72,
          y: 3.77,
          z: 2.33
        },

        target: {
          x: -1.33,
          y: 1.89,
          z: 0.11
        }

      },


      WINDOW: {

        camera: {
          x: -1.74,
          y: 2.52,
          z: -0.52
        },

        target: {
          x: -1.66,
          y: 2.75,
          z: -1.47
        }

      },


      // มุมสำหรับผ้า
      CLOTH: {

        camera: {
          x: 2.8,
          y: 3.0,
          z: 3.5
        },

        target: {
          x: 0.0,
          y: 2.0,
          z: 0.0
        }

      },


      // มุมสำหรับลูกบอล
      BALL: {

        camera: {
          x: 3.0,
          y: 2.5,
          z: 3.0
        },

        target: {
          x: 0.0,
          y: 1.5,
          z: 0.0
        }

      }

    };


    // =========================================================
    // ส่วนที่ 2 : THREE.JS Scene
    // =========================================================

    const scene =
      new THREE.Scene();


    scene.background =
      new THREE.Color(0x333333);


    // =========================================================
    // Camera
    // =========================================================

    const camera =
      new THREE.PerspectiveCamera(

        45,

        window.innerWidth /
        window.innerHeight,

        0.1,

        100

      );


    // =========================================================
    // Renderer
    // =========================================================

    const renderer =
      new THREE.WebGLRenderer({

        antialias: true

      });


    renderer.setSize(

      window.innerWidth,

      window.innerHeight

    );


    // สำหรับ Three.js r128
    renderer.outputEncoding =
      THREE.sRGBEncoding;


    document.body.appendChild(
      renderer.domElement
    );


    // =========================================================
    // Orbit Controls
    // =========================================================

    const controls =
      new THREE.OrbitControls(

        camera,

        renderer.domElement

      );


    controls.enableDamping = true;


    // =========================================================
    // ส่วนที่ 3 : แสง
    // =========================================================

    const ambientLight =
      new THREE.AmbientLight(

        0xffffff,

        0.7

      );


    scene.add(
      ambientLight
    );


    const sunLight =
      new THREE.DirectionalLight(

        SUN_CONFIG.color,

        SUN_CONFIG.intensity

      );


    sunLight.position.set(

      SUN_CONFIG.x,

      SUN_CONFIG.y,

      SUN_CONFIG.z

    );


    scene.add(
      sunLight
    );


    const ovenLight =
      new THREE.PointLight(

        MICROWAVE_LIGHT_CONFIG.color,

        MICROWAVE_LIGHT_CONFIG.intensity,

        MICROWAVE_LIGHT_CONFIG.distance

      );


    ovenLight.position.set(

      MICROWAVE_LIGHT_CONFIG.x,

      MICROWAVE_LIGHT_CONFIG.y,

      MICROWAVE_LIGHT_CONFIG.z

    );


    scene.add(
      ovenLight
    );


    // =========================================================
    // ส่วนที่ 4 : VERTEX SHADER สำหรับผ้า
    // =========================================================

    /*
      Vertex Shader
      ----------------------------

      Shader นี้ทำให้ Vertex ของผ้า
      ขยับขึ้นลงตามเวลา

      position.x
      position.y
      position.z

      จะถูกนำมาคำนวณใหม่

      ทำให้เกิดลักษณะคล้ายผ้าพลิ้ว
    */

    const clothVertexShader = `

      uniform float time;

      varying vec2 vUv;

      void main() {

        vUv = uv;

        vec3 newPosition = position;

        // คลื่นหลัก
        float wave =
          sin(
            position.x * 4.0 +
            time * 2.0
          ) * 0.12;

        // คลื่นเพิ่มเติม
        float wave2 =
          cos(
            position.y * 3.0 +
            time * 1.5
          ) * 0.08;

        // ทำให้ผ้าพลิ้วตามแกน Z
        newPosition.z +=
          wave + wave2;

        // คำนวณตำแหน่ง Vertex ใหม่
        gl_Position =
          projectionMatrix *
          modelViewMatrix *
          vec4(
            newPosition,
            1.0
          );

      }

    `;


    // =========================================================
    // Fragment Shader ของผ้า
    // =========================================================

    const clothFragmentShader = `

      varying vec2 vUv;

      void main() {

        // สีผ้า
        vec3 clothColor =
          vec3(
            0.85,
            0.15,
            0.25
          );

        // ทำ Gradient เล็กน้อย
        clothColor *=
          0.75 +
          0.25 * vUv.y;

        gl_FragColor =
          vec4(
            clothColor,
            1.0
          );

      }

    `;


    // =========================================================
    // Material สำหรับผ้า
    // =========================================================

    const clothMaterial =
      new THREE.ShaderMaterial({

        uniforms: {

          time: {
            value: 0
          }

        },

        vertexShader:
          clothVertexShader,

        fragmentShader:
          clothFragmentShader,

        side: THREE.DoubleSide

      });


    // =========================================================
    // ส่วนที่ 5 : สร้างผ้า
    // =========================================================

    /*
      PlaneGeometry มีหลาย Segment
      เพื่อให้ Vertex Shader สามารถ
      ขยับ Vertex ได้ละเอียด
    */

    const clothGeometry =
      new THREE.PlaneGeometry(

        2.4,
        1.8,

        40,
        30

      );


    const cloth =
      new THREE.Mesh(

        clothGeometry,

        clothMaterial

      );


    /*
      หมุนผ้าให้อยู่ในแนวตั้ง
    */

    cloth.rotation.y =
      Math.PI / 2;


    /*
      ตำแหน่งผ้า

      วางไว้บริเวณด้านข้างของห้อง
    */

    cloth.position.set(

      -3.6,3.0,1.2

    );


    scene.add(
      cloth
    );


    console.log(
      'Vertex Shader: Cloth created'
    );


    // =========================================================
    // ส่วนที่ 6 : FRAGMENT SHADER สำหรับลูกบอล
    // =========================================================

    /*
      Fragment Shader
      ----------------------------

      Fragment Shader จะคำนวณสี
      ของแต่ละ Fragment ของลูกบอล

      ใช้ normal ของพื้นผิว
      เพื่อสร้าง Gradient สี
    */

    const ballVertexShader = `

      varying vec3 vNormal;

      void main() {

        // ส่ง Normal ไปยัง Fragment Shader
        vNormal =
          normalize(
            normalMatrix *
            normal
          );

        gl_Position =
          projectionMatrix *
          modelViewMatrix *
          vec4(
            position,
            1.0
          );

      }

    `;


    const ballFragmentShader = `

      varying vec3 vNormal;

      void main() {

        // แปลง Normal ให้เป็นค่าที่ใช้สร้างสี
        vec3 normalColor =
          normalize(
            vNormal
          ) * 0.5 + 0.5;

        // สีหลักของลูกบอล
        vec3 ballColor =
          vec3(
            0.1,
            0.45,
            1.0
          );

        // สร้างแสงตาม Normal
        float light =
          max(
            dot(
              normalize(vNormal),
              normalize(
                vec3(
                  0.5,
                  0.8,
                  1.0
                )
              )
            ),
            0.0
          );

        // รวมสี
        vec3 finalColor =
          ballColor *
          (0.45 + light * 0.75);

        // ส่งสี Fragment ออกมา
        gl_FragColor =
          vec4(
            finalColor,
            1.0
          );

      }

    `;


    // =========================================================
    // Shader Material ของลูกบอล
    // =========================================================

    const ballMaterial =
      new THREE.ShaderMaterial({

        vertexShader:
          ballVertexShader,

        fragmentShader:
          ballFragmentShader

      });


    // =========================================================
    // สร้างลูกบอล
    // =========================================================

    const ballGeometry =
      new THREE.SphereGeometry(

        0.55,

        64,

        64

      );


    const ball =
      new THREE.Mesh(

        ballGeometry,

        ballMaterial

      );


    /*
      ตำแหน่งลูกบอล
    */

    ball.position.set(

      -2.9,0.6,2.0

    );


    scene.add(
      ball
    );


    console.log(
      'Fragment Shader: Ball created'
    );


    // =========================================================
    // ส่วนที่ 7 : โหลด GLB
    // =========================================================

    const loader =
      new THREE.GLTFLoader();


    const modelUrl =
      'https://warada-800.github.io/Warada-800.github.io_wed-Page/BEDROOM19.glb';


    let roomModel =
      null;


    loader.load(

      modelUrl,

      (gltf) => {

        roomModel =
          gltf.scene;


        scene.add(
          roomModel
        );


        /*
          สำรวจ Mesh ของ GLB

          ไม่เปลี่ยน Material เดิม
          เพราะต้องการรักษา Texture
          ของห้องเอาไว้
        */

        roomModel.traverse(

          (child) => {

            if (
              child.isMesh
            ) {

              console.log(
                'GLB Mesh:',
                child.name
              );

            }

          }

        );


        setView(
          'overview',
          false
        );

      },

      undefined,

      (error) => {

        console.error(
          'เกิดข้อผิดพลาดในการโหลด GLB:',
          error
        );

      }

    );


    // =========================================================
    // ส่วนที่ 8 : เปลี่ยนมุมกล้อง
    // =========================================================

    function setView(

      name,

      animated = true

    ) {

      const view =
        CAMERA_VIEWS[name];


      if (!view)
        return;


      gsap.killTweensOf(
        camera.position
      );


      gsap.killTweensOf(
        controls.target
      );


      if (animated) {

        gsap.to(

          camera.position,

          {

            x:
              view.camera.x,

            y:
              view.camera.y,

            z:
              view.camera.z,

            duration:
              1.2,

            ease:
              'power2.out'

          }

        );


        gsap.to(

          controls.target,

          {

            x:
              view.target.x,

            y:
              view.target.y,

            z:
              view.target.z,

            duration:
              1.2,

            ease:
              'power2.out',

            onUpdate:
              () => {

                controls.update();

              }

          }

        );

      }

      else {

        camera.position.set(

          view.camera.x,

          view.camera.y,

          view.camera.z

        );


        controls.target.set(

          view.target.x,

          view.target.y,

          view.target.z

        );


        controls.update();

      }

    }


    // =========================================================
    // ส่วนที่ 9 : Interaction
    // =========================================================

    const raycaster =
      new THREE.Raycaster();


    const mouse =
      new THREE.Vector2();


    let startX = 0;

    let startY = 0;


    window.addEventListener(

      'pointerdown',

      (event) => {

        startX =
          event.clientX;

        startY =
          event.clientY;

      }

    );


    window.addEventListener(

      'pointerup',

      (event) => {

        /*
          ถ้ากดปุ่มเมนู
          ไม่ต้องทำ Raycast
        */

        if (

          event.target.closest(
            '#menu'
          )

          ||

          (
            event.target.tagName &&

            event.target.tagName
              .toLowerCase()
              === 'button'
          )

        ) {

          return;

        }


        const diffX =
          Math.abs(
            event.clientX -
            startX
          );


        const diffY =
          Math.abs(
            event.clientY -
            startY
          );


        /*
          ถ้าลากเกิน 7 pixel
          ถือว่าเป็นการหมุน
        */

        if (

          diffX > 7 ||

          diffY > 7

        ) {

          return;

        }


        mouse.x =
          (
            event.clientX /
            window.innerWidth
          ) * 2 - 1;


        mouse.y =
          -(
            event.clientY /
            window.innerHeight
          ) * 2 + 1;


        raycaster.setFromCamera(

          mouse,

          camera

        );


        const intersects =
          raycaster.intersectObjects(

            scene.children,

            true

          );


        if (

          intersects.length > 0

        ) {

          const hit =
            intersects.find(

              item =>
                item.object.type
                === 'Mesh'

            );


          if (!hit) {

            setView(
              'overview'
            );

            return;

          }


          const p =
            hit.point;


          console.log(

            `📍 จุดที่กด: ` +

            `X = ${p.x.toFixed(2)}, ` +

            `Y = ${p.y.toFixed(2)}, ` +

            `Z = ${p.z.toFixed(2)}`

          );


          /*
            ถ้าคลิกลูกบอล
          */

          if (
            hit.object === ball
          ) {

            setView(
              'BALL'
            );

            return;

          }


          /*
            ถ้าคลิกผ้า
          */

          if (
            hit.object === cloth
          ) {

            setView(
              'CLOTH'
            );

            return;

          }


          // หน้าต่าง
          if (

            p.x < -0.8 &&

            p.z < -0.6

          ) {

            setView(
              'WINDOW'
            );

          }


          // เตียง
          else if (

            p.x < -0.2

          ) {

            setView(
              'BED'
            );

          }


          // คอม
          else if (

            p.x > 0.7 &&

            p.z < -0.7

          ) {

            setView(
              'COM'
            );

          }


          // TV
          else if (

            p.x > 0.7 &&

            p.z >= -0.7

          ) {

            setView(
              'TV'
            );

          }


          else {

            setView(
              'overview'
            );

          }

        }

        else {

          setView(
            'overview'
          );

        }

      }

    );


    // =========================================================
    // ส่วนที่ 10 : Camera Information
    // =========================================================

    const infoBox =
      document.getElementById(
        'cam-info'
      );


    function logCameraPosition() {

      const cam = {

        x:
          parseFloat(
            camera.position.x.toFixed(2)
          ),

        y:
          parseFloat(
            camera.position.y.toFixed(2)
          ),

        z:
          parseFloat(
            camera.position.z.toFixed(2)
          )

      };


      const tgt = {

        x:
          parseFloat(
            controls.target.x.toFixed(2)
          ),

        y:
          parseFloat(
            controls.target.y.toFixed(2)
          ),

        z:
          parseFloat(
            controls.target.z.toFixed(2)
          )

      };


      infoBox.innerHTML = `

        Camera:
        {
          x: ${cam.x},
          y: ${cam.y},
          z: ${cam.z}
        }

        <br>

        Target:
        {
          x: ${tgt.x},
          y: ${tgt.y},
          z: ${tgt.z}
        }

      `;


      console.log(

        `camera: { ` +

        `x: ${cam.x}, ` +

        `y: ${cam.y}, ` +

        `z: ${cam.z} }, ` +

        `target: { ` +

        `x: ${tgt.x}, ` +

        `y: ${tgt.y}, ` +

        `z: ${tgt.z} }`

      );

    }


    controls.addEventListener(

      'end',

      logCameraPosition

    );


    // =========================================================
    // กด C เพื่อดูพิกัด
    // =========================================================

    window.addEventListener(

      'keydown',

      (e) => {

        if (

          e.key === 'c' ||

          e.key === 'C'

        ) {

          console.warn(

            '--- พิกัดมุมมองปัจจุบัน ---'

          );

          logCameraPosition();

        }

      }

    );


    // =========================================================
    // ส่วนที่ 11 : Resize
    // =========================================================

    window.addEventListener(

      'resize',

      () => {

        camera.aspect =

          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

          window.innerWidth,

          window.innerHeight

        );

      }

    );


    // =========================================================
    // ส่วนที่ 12 : Animation Loop
    // =========================================================

    const clock =
      new THREE.Clock();


    function animate() {

      requestAnimationFrame(
        animate
      );


      // เวลา Shader
      const elapsedTime =
        clock.getElapsedTime();


      /*
        ส่งเวลาเข้า Vertex Shader
        ของผ้า
      */

      clothMaterial
        .uniforms
        .time
        .value =
        elapsedTime;


      /*
        หมุนลูกบอลเล็กน้อย
        เพื่อให้เห็น Shader รอบลูก
      */

      ball.rotation.y +=
        0.005;


      controls.update();


      renderer.render(

        scene,

        camera

      );

    }


    animate();

  </script>

</body>
</html>
