<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3D Bedroom Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #08080d;
            font-family: Arial, sans-serif;
        }

        #info {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;

            padding: 15px 20px;

            background: rgba(10, 10, 18, 0.85);
            border: 1px solid rgba(150, 50, 255, 0.5);
            border-radius: 12px;

            color: white;

            backdrop-filter: blur(10px);

            box-shadow:
                0 0 20px rgba(130, 0, 255, 0.25);
        }

        #info h1 {
            font-size: 22px;
            margin-bottom: 6px;
        }

        #info p {
            font-size: 13px;
            color: #bbbbbb;
        }

        #loading {
            position: fixed;
            inset: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #08080d;

            color: white;
            font-size: 20px;

            z-index: 20;
        }

        #error {
            display: none;

            position: fixed;
            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            padding: 25px;

            background: #180909;
            border: 1px solid #ff4444;
            border-radius: 12px;

            color: white;

            z-index: 30;

            max-width: 500px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div id="loading">
        Loading Bedroom...
    </div>

    <div id="error">
        <h2>ไม่สามารถโหลด BEDROOM.glb ได้</h2>
        <p id="errorText"></p>
    </div>

    <div id="info">
        <h1>My 3D Bedroom</h1>
        <p>🖱️ ลากเมาส์ = หมุนมุมมอง</p>
        <p>🖱️ Scroll = Zoom</p>
        <p>🖱️ คลิกกลาง + ลาก = เลื่อน</p>
    </div>


    <!-- THREE.JS -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>


    <script type="module">

        import * as THREE from "three";

        import { OrbitControls } 
            from "three/addons/controls/OrbitControls.js";

        import { GLTFLoader } 
            from "three/addons/loaders/GLTFLoader.js";


        // =====================================================
        // SCENE
        // =====================================================

        const scene = new THREE.Scene();

        scene.background = new THREE.Color(0x08080d);


        // =====================================================
        // CAMERA
        // =====================================================

        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.01,
            1000
        );

        camera.position.set(
            8,
            6,
            8
        );


        // =====================================================
        // RENDERER
        // =====================================================

        const renderer = new THREE.WebGLRenderer({
            antialias: true
        });

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2)
        );

        renderer.outputColorSpace = THREE.SRGBColorSpace;

        renderer.shadowMap.enabled = true;

        renderer.shadowMap.type =
            THREE.PCFSoftShadowMap;

        document.body.appendChild(
            renderer.domElement
        );


        // =====================================================
        // ORBIT CONTROLS
        // =====================================================

        const controls = new OrbitControls(
            camera,
            renderer.domElement
        );

        controls.enableDamping = true;

        controls.dampingFactor = 0.05;

        controls.enablePan = true;

        controls.enableZoom = true;

        controls.minDistance = 2;

        controls.maxDistance = 30;


        // =====================================================
        // LIGHTING
        // =====================================================

        // Ambient

        const ambientLight =
            new THREE.AmbientLight(
                0xffffff,
                1.5
            );

        scene.add(ambientLight);


        // Main light

        const mainLight =
            new THREE.DirectionalLight(
                0xffffff,
                3
            );

        mainLight.position.set(
            5,
            10,
            5
        );

        mainLight.castShadow = true;

        mainLight.shadow.mapSize.width = 2048;

        mainLight.shadow.mapSize.height = 2048;

        scene.add(mainLight);


        // Purple RGB light

        const purpleLight =
            new THREE.PointLight(
                0x8a00ff,
                30,
                15
            );

        purpleLight.position.set(
            -3,
            3,
            1
        );

        scene.add(purpleLight);


        // Blue RGB light

        const blueLight =
            new THREE.PointLight(
                0x0066ff,
                25,
                15
            );

        blueLight.position.set(
            3,
            2.5,
            -2
        );

        scene.add(blueLight);


        // Warm light

        const warmLight =
            new THREE.PointLight(
                0xff8a30,
                15,
                10
            );

        warmLight.position.set(
            -2,
            2,
            2
        );

        scene.add(warmLight);


        // =====================================================
        // GLB MODEL
        // =====================================================

        const loader = new GLTFLoader();


        /*
            IMPORTANT

            ไฟล์อยู่ที่:

            GitHub Repository
            Warada-800/Warada-800.github.io_wed-Page

            ชื่อไฟล์:
            BEDROOM.glb
        */

        const MODEL_URL =
            "https://raw.githubusercontent.com/Warada-800/Warada-800.github.io_wed-Page/main/BEDROOM.glb";


        loader.load(

            MODEL_URL,

            function (gltf) {

                console.log(
                    "BEDROOM.glb loaded!"
                );


                const bedroom =
                    gltf.scene;


                // =========================================
                // ADD MODEL
                // =========================================

                scene.add(
                    bedroom
                );


                // =========================================
                // ENABLE SHADOW
                // =========================================

                bedroom.traverse(
                    function (object) {

                        if (
                            object.isMesh
                        ) {

                            object.castShadow =
                                true;

                            object.receiveShadow =
                                true;

                            if (
                                object.material
                            ) {

                                object.material
                                    .needsUpdate = true;

                            }

                        }

                    }
                );


                // =========================================
                // FIND MODEL BOUNDING BOX
                // =========================================

                const box =
                    new THREE.Box3()
                        .setFromObject(
                            bedroom
                        );


                const size =
                    box.getSize(
                        new THREE.Vector3()
                    );


                const center =
                    box.getCenter(
                        new THREE.Vector3()
                    );


                console.log(
                    "Model size:",
                    size
                );


                // =========================================
                // CENTER MODEL
                // =========================================

                bedroom.position.x -=
                    center.x;

                bedroom.position.y -=
                    center.y;

                bedroom.position.z -=
                    center.z;


                // =========================================
                // AUTO SCALE
                // =========================================

                const maxSize =
                    Math.max(
                        size.x,
                        size.y,
                        size.z
                    );


                const targetSize = 8;


                const scale =
                    targetSize / maxSize;


                bedroom.scale.set(
                    scale,
                    scale,
                    scale
                );


                // =========================================
                // RE-CENTER AFTER SCALE
                // =========================================

                const scaledBox =
                    new THREE.Box3()
                        .setFromObject(
                            bedroom
                        );


                const scaledCenter =
                    scaledBox.getCenter(
                        new THREE.Vector3()
                    );


                bedroom.position.x -=
                    scaledCenter.x;

                bedroom.position.y -=
                    scaledCenter.y;

                bedroom.position.z -=
                    scaledCenter.z;


                // =========================================
                // CAMERA TARGET
                // =========================================

                const finalBox =
                    new THREE.Box3()
                        .setFromObject(
                            bedroom
                        );


                const finalCenter =
                    finalBox.getCenter(
                        new THREE.Vector3()
                    );


                controls.target.copy(
                    finalCenter
                );


                // =========================================
                // CAMERA POSITION
                // =========================================

                camera.position.set(
                    9,
                    7,
                    9
                );


                controls.update();


                // =========================================
                // HIDE LOADING
                // =========================================

                document.getElementById(
                    "loading"
                ).style.display = "none";

            },


            // =============================================
            // LOADING PROGRESS
            // =============================================

            function (xhr) {

                if (xhr.total) {

                    const percent =
                        (xhr.loaded /
                        xhr.total) * 100;

                    console.log(
                        "Loading:",
                        percent.toFixed(0) + "%"
                    );

                }

            },


            // =============================================
            // ERROR
            // =============================================

            function (error) {

                console.error(
                    "Error loading BEDROOM.glb:",
                    error
                );


                document.getElementById(
                    "loading"
                ).style.display = "none";


                document.getElementById(
                    "error"
                ).style.display = "block";


                document.getElementById(
                    "errorText"
                ).innerText =
                    "ตรวจสอบว่าไฟล์ BEDROOM.glb อยู่ใน main branch และชื่อไฟล์ตรงกัน";
            }

        );


        // =====================================================
        // RESIZE
        // =====================================================

        window.addEventListener(
            "resize",
            function () {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;

                camera.updateProjectionMatrix();


                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

            }
        );


        // =====================================================
        // ANIMATION LOOP
        // =====================================================

        function animate() {

            requestAnimationFrame(
                animate
            );


            controls.update();


            renderer.render(
                scene,
                camera
            );

        }


        animate();

    </script>

</body>
</html>
